name: Staging CI/CD

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  test:
    # 8.5 is what the servers and developers run (composer.json pins
    # config.platform.php to it). Add a version here when moving to the next.
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: etigo_api_test
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, redis, mbstring, xml, curl, zip, bcmath, intl, gd
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i '/^DB_DATABASE=/c\DB_DATABASE=etigo_api_test' .env
          sed -i '/^DB_USERNAME=/c\DB_USERNAME=root' .env
          sed -i '/^DB_PASSWORD=/c\DB_PASSWORD=password' .env
          sed -i 's/REDIS_SCHEME=tls/REDIS_SCHEME=tcp/' .env
          sed -i 's/REDIS_PASSWORD=null/REDIS_PASSWORD=/' .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test

  deploy:
    name: Deploy to Staging
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    steps:
      - uses: actions/checkout@v7

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Run deployment
        run: |
          ssh -i ~/.ssh/id_ed25519 deploy@${{ secrets.SERVER_IP }} 'bash -s' < deployment/deploy.sh

      - name: Verify deployment
        run: |
          sleep 5
          STATUS=$(ssh -i ~/.ssh/id_ed25519 deploy@${{ secrets.SERVER_IP }} "curl -sk -o /dev/null -w '%{http_code}' -H 'Host: etigo-api.apeinhood.xyz' https://localhost/api/v1/health")
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status: $STATUS"
            exit 1
          fi
          echo "Deployment verified — HTTP $STATUS"
