services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${ETIGO_POSTGRES_DB:-etigo_api}
      POSTGRES_USER: ${ETIGO_POSTGRES_USER:-etigo}
      POSTGRES_PASSWORD: ${ETIGO_POSTGRES_PASSWORD:-etigo_local_password}
    ports:
      - "${ETIGO_POSTGRES_PORT:-5432}:5432"
    volumes:
      - etigo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${ETIGO_REDIS_PORT:-6380}:6379"
    volumes:
      - etigo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  etigo_postgres_data:
  etigo_redis_data:
